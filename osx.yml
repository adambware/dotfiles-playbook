---
# MacOS Setup Playbook

- name: "Setup macOS environment"
  hosts: localhost
  connection: local
  gather_facts: true  # Enable facts gathering to detect architecture
  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: "Ensure Ansible collections are installed"
      ansible.builtin.shell: "ansible-galaxy collection install community.general"
      changed_when: false
      
  roles:
    - role: adambware.homebrew-install
      tags: ['homebrew', 'setup']
      
    - role: adambware.zsh
      tags: ['zsh', 'shell']
      
    - role: adambware.homebrew-packages
      tags: ['packages', 'homebrew']
      
    - role: adambware.homebrew-casks
      tags: ['casks', 'homebrew', 'apps']
      
    - role: adambware.node
      tags: ['node', 'development']
      
    - role: adambware.python
      tags: ['python', 'development']
      
    - role: adambware.ruby
      tags: ['ruby', 'development']
      
    - role: adambware.osx
      tags: ['osx', 'settings']
      
    - role: adambware.auto-updates
      tags: ['osx', 'updates']
      
    - role: adambware.private
      tags: ['private']
      when: setup_private_configs | default(true)
