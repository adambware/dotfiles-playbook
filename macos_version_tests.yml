---
# Tests specifically for macOS version compatibility

- name: "Test macOS version-specific features"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running macOS version-specific tests"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
    
    - name: Set macOS version facts
      ansible.builtin.set_fact:
        is_monterey: "{{ ansible_distribution_version is version('12.0', '>=') and ansible_distribution_version is version('13.0', '<') }}"
        is_ventura: "{{ ansible_distribution_version is version('13.0', '>=') and ansible_distribution_version is version('14.0', '<') }}"
        is_sonoma: "{{ ansible_distribution_version is version('14.0', '>=') }}"
        is_future: "{{ ansible_distribution_version is version('15.0', '>=') }}"

  tasks:
    # Test Monterey specific features
    - name: Test macOS Monterey (12.x) specific features
      block:
        - name: Check Monterey window management features
          ansible.builtin.command: defaults read com.apple.WindowManager
          register: monterey_window_mgr
          changed_when: false
          failed_when: monterey_window_mgr.rc != 0
          
        - name: Check Monterey shortcuts settings
          ansible.builtin.command: defaults read com.apple.symbolichotkeys
          register: monterey_shortcuts
          changed_when: false
          failed_when: monterey_shortcuts.rc != 0
          
        - name: Check Monterey Focus modes
          ansible.builtin.command: defaults read com.apple.donotdisturb
          register: monterey_focus
          changed_when: false
          failed_when: monterey_focus.rc != 0
      when: is_monterey
      tags: ['version', 'monterey']
    
    # Test Ventura specific features
    - name: Test macOS Ventura (13.x) specific features
      block:
        - name: Check Ventura Stage Manager
          ansible.builtin.command: defaults read com.apple.WindowManager StageManagerEnabled
          register: ventura_stage_mgr
          changed_when: false
          failed_when: false  # Don't fail if not exists
          
        - name: Check Ventura System Settings
          ansible.builtin.shell: ls -la /System/Library/PreferencePanes/
          register: ventura_settings
          changed_when: false
          failed_when: ventura_settings.rc != 0
          
        - name: Check Ventura Focus modes
          ansible.builtin.command: defaults read com.apple.focusmode
          register: ventura_focus
          changed_when: false
          failed_when: false  # Don't fail if not exists
      when: is_ventura
      tags: ['version', 'ventura']
    
    # Test Sonoma specific features
    - name: Test macOS Sonoma (14.x) specific features
      block:
        - name: Check Sonoma Lock Screen settings
          ansible.builtin.command: defaults read com.apple.screensaver
          register: sonoma_lock
          changed_when: false
          failed_when: sonoma_lock.rc != 0
          
        - name: Check Sonoma widgets
          ansible.builtin.command: defaults read com.apple.WindowManager DesktopWidgetsEnabled
          register: sonoma_widgets
          changed_when: false
          failed_when: false  # Don't fail if not exists
          
        - name: Check Sonoma Safari features
          ansible.builtin.command: defaults read com.apple.Safari
          register: sonoma_safari
          changed_when: false
          failed_when: sonoma_safari.rc != 0
      when: is_sonoma
      tags: ['version', 'sonoma']
    
    # Test features for future macOS versions
    - name: Test future macOS version compatibility
      block:
        - name: Check compatibility with future macOS
          ansible.builtin.debug:
            msg: "Running on a future macOS version ({{ ansible_distribution_version }})"
          
        - name: Verify basic system settings still work
          ansible.builtin.command: defaults read NSGlobalDomain
          register: future_settings
          changed_when: false
          failed_when: future_settings.rc != 0
      when: is_future
      tags: ['version', 'future']
    
    # Test architecture-specific settings
    - name: Test Apple Silicon specific settings
      block:
        - name: Check Rosetta 2 installation
          ansible.builtin.shell: pkgutil --pkgs | grep -q 'com.apple.pkg.RosettaUpdateAuto'
          register: rosetta_check
          changed_when: false
          failed_when: false  # Don't fail if not installed
          
        - name: Report Rosetta status
          ansible.builtin.debug:
            msg: "Rosetta 2 is {{ 'installed' if rosetta_check.rc == 0 else 'not installed' }}"
      when: ansible_architecture == "arm64"
      tags: ['version', 'apple-silicon']
    
    - name: Test Intel specific settings
      block:
        - name: Check Intel-specific settings
          ansible.builtin.debug:
            msg: "Running on Intel architecture"
      when: ansible_architecture == "x86_64"
      tags: ['version', 'intel']
    
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ macOS version-specific tests completed
          
          Testing on macOS {{ ansible_distribution_version }}
          
          {% if is_monterey %}
          Monterey specific features:
            - Window management: {{ "✅ OK" if monterey_window_mgr.rc == 0 else "❌ Failed" }}
            - Shortcuts: {{ "✅ OK" if monterey_shortcuts.rc == 0 else "❌ Failed" }}
            - Focus: {{ "✅ OK" if monterey_focus.rc == 0 else "❌ Failed" }}
          {% endif %}
          
          {% if is_ventura %}
          Ventura specific features:
            - Stage Manager: {{ "✅ OK" if ventura_stage_mgr is defined else "⚠️ Not tested" }}
            - System Settings: {{ "✅ OK" if ventura_settings.rc == 0 else "❌ Failed" }}
            - Focus modes: {{ "✅ OK" if ventura_focus is defined else "⚠️ Not tested" }}
          {% endif %}
          
          {% if is_sonoma %}
          Sonoma specific features:
            - Lock Screen: {{ "✅ OK" if sonoma_lock.rc == 0 else "❌ Failed" }}
            - Widgets: {{ "✅ OK" if sonoma_widgets is defined else "⚠️ Not tested" }}
            - Safari: {{ "✅ OK" if sonoma_safari.rc == 0 else "❌ Failed" }}
          {% endif %}
          
          {% if is_future %}
          Future macOS compatibility:
            - Basic settings: {{ "✅ OK" if future_settings.rc == 0 else "❌ Failed" }}
          {% endif %}
          
          Architecture-specific settings:
          {% if ansible_architecture == "arm64" %}
            - Rosetta 2: {{ "✅ Installed" if rosetta_check.rc == 0 else "⚠️ Not installed" }}
          {% else %}
            - Intel settings: ✅ OK
          {% endif %}
      
      tags: ['version', 'summary']
