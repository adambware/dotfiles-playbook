---
# Advanced Idempotence test playbook
# This runs the playbook twice to verify that the second run makes no changes

- name: "Advanced idempotence testing for macOS setup"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/main.yml
  vars:
    test_tags: "{{ lookup('env', 'TEST_TAGS') | default('') }}"
    test_role: "{{ lookup('env', 'TEST_ROLE') | default('') }}"
    results_file: "/tmp/idempotence_results.json"

  pre_tasks:
    - name: Display system information
      ansible.builtin.debug:
        msg: 
          - "Running advanced idempotence test for macOS setup"
          - "This will execute the playbook twice to ensure the second run makes no changes"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "{% if test_tags %}Testing only tags: {{ test_tags }}{% endif %}"
          - "{% if test_role %}Testing only role: {{ test_role }}{% endif %}"
          - "Detailed results will be saved to {{ results_file }}"

  tasks:
    - name: Set playbook command based on test configuration
      ansible.builtin.set_fact:
        playbook_cmd: >-
          ansible-playbook osx.yml --skip-tags=never
          {% if test_tags %} --tags={{ test_tags }}{% endif %}
          {% if test_role %} --tags={{ test_role | regex_replace('^adambware\.', '') }}{% endif %}

    - name: First run - Execute the playbook (will make changes)
      ansible.builtin.command: "{{ playbook_cmd }}"
      register: first_run
      changed_when: false

    - name: Display first run summary
      ansible.builtin.debug:
        msg: |
          First run completed with:
          Changed tasks: {{ first_run.stdout | regex_search('changed=[0-9]+') | default('changed=0') }}
          Ok tasks: {{ first_run.stdout | regex_search('ok=[0-9]+') | default('ok=0') }}

    - name: Second run - Execute the playbook again (should be idempotent)
      ansible.builtin.command: "{{ playbook_cmd }}"
      register: second_run
      changed_when: false

    - name: Parse changed tasks from second run
      ansible.builtin.set_fact:
        changed_count: "{{ second_run.stdout | regex_search('changed=([0-9]+)', '\\1') | default('0') }}"
        changed_tasks: []

    - name: Extract non-idempotent tasks
      ansible.builtin.shell: >
        echo '{{ second_run.stdout }}' | grep -B 2 "changed:" | grep -v "\-\-" | grep -v "changed:" | awk '{$1=""; print $0}'
      register: non_idempotent_task_list
      when: changed_count|int > 0
      changed_when: false
      failed_when: false

    - name: Process non-idempotent tasks
      ansible.builtin.set_fact:
        changed_tasks: "{{ non_idempotent_task_list.stdout_lines | default([]) }}"
      when: changed_count|int > 0

    - name: Save detailed results to file
      ansible.builtin.copy:
        content: |
          {
            "timestamp": "{{ ansible_date_time.iso8601 }}",
            "system": {
              "os_version": "{{ ansible_distribution }} {{ ansible_distribution_version }}",
              "architecture": "{{ ansible_architecture }}"
            },
            "test_config": {
              "tags": "{{ test_tags }}",
              "role": "{{ test_role }}"
            },
            "results": {
              "first_run": {
                "changed": "{{ first_run.stdout | regex_search('changed=([0-9]+)', '\\1') | default('0') }}",
                "ok": "{{ first_run.stdout | regex_search('ok=([0-9]+)', '\\1') | default('0') }}"
              },
              "second_run": {
                "changed": "{{ changed_count }}",
                "ok": "{{ second_run.stdout | regex_search('ok=([0-9]+)', '\\1') | default('0') }}"
              },
              "non_idempotent_tasks": {{ changed_tasks | to_json }}
            },
            "is_idempotent": {{ (changed_count|int == 0) | to_json }}
          }
        dest: "{{ results_file }}"
      when: changed_count is defined

    - name: Display idempotence test results with detailed information
      ansible.builtin.debug:
        msg: |
          Idempotence Test Results:
          
          Changed tasks on second run: {{ changed_count }}
          
          {% if changed_count|int > 0 %}
          ⚠️ The playbook is not fully idempotent. The following tasks made changes when run again:
          
          {% for task in changed_tasks %}
          - {{ task }}
          {% endfor %}
          
          Consider reviewing these tasks for better state detection.
          Detailed results saved to {{ results_file }}
          {% else %}
          ✅ The playbook is fully idempotent! No tasks made changes when run again.
          {% endif %}
      
  post_tasks:
    - name: Suggest improvements for non-idempotent tasks
      ansible.builtin.debug:
        msg: |
          Tips to improve idempotence for common task types:
          
          For command/shell tasks:
            - Add changed_when with a condition that detects real changes
            - Use creates/removes parameters for file creation tasks
            - Use register + conditions to run only when needed
            
            Example:
              - name: Create a file only if it doesn't exist
                ansible.builtin.command: touch /path/to/file
                args:
                  creates: /path/to/file
                
              - name: Check if configuration needs to be updated
                ansible.builtin.shell: grep -q "setting=value" /etc/config
                register: config_check
                changed_when: false
                failed_when: false
                
              - name: Update configuration if needed
                ansible.builtin.shell: echo "setting=value" >> /etc/config
                when: config_check.rc != 0
          
          For file operations:
            - Use mode parameters with explicit permissions
            - Use the copy module's checksum feature
            
            Example:
              - name: Copy file with explicit mode
                ansible.builtin.copy:
                  src: file.txt
                  dest: /path/to/file.txt
                  mode: '0644'
                  owner: "{{ ansible_user_id }}"
                  group: "{{ ansible_user_gid }}"
          
          For package managers:
            - Specify exact versions when needed
            - Use state: present only when appropriate
            
            Example:
              - name: Install package at specific version
                ansible.builtin.homebrew:
                  name: package
                  state: present
                  version: 1.2.3
                
          For configuration files:
            - Consider using templates with strict validation
            - Use the lineinfile/blockinfile modules with check_mode
            
            Example:
              - name: Update line in file
                ansible.builtin.lineinfile:
                  path: /path/to/file
                  regexp: '^# setting='
                  line: 'setting=value'
                  state: present
      when: changed_count|int > 0

    - name: Provide next steps for action
      ansible.builtin.debug:
        msg: |
          {% if changed_count|int > 0 %}
          Next steps:
          
          1. Review the non-idempotent tasks identified above
          2. Edit the task definitions in the appropriate role files
          3. Run the idempotence test again to verify your fixes
          
          You can test a specific role with:
            ./setup.sh --idempotence --role=ROLE_NAME
          
          Or specific tags with:
            TEST_TAGS=tag1,tag2 ./setup.sh --idempotence
          {% else %}
          Congratulations! Your playbook is fully idempotent.
          
          This means you can run it multiple times without making unnecessary changes,
          which is ideal for configuration management and automation.
          {% endif %}

    - name: Save detailed results to file
      ansible.builtin.copy:
        content: |
          {
            "first_run": {
              "changed_tasks": "{{ first_run.stdout | regex_search('changed=[0-9]+') | default('changed=0') }}",
              "ok_tasks": "{{ first_run.stdout | regex_search('ok=[0-9]+') | default('ok=0') }}"
            },
            "second_run": {
              "changed_tasks": "{{ changed_count }}",
              "task_list": {{ changed_tasks | to_json }}
            },
            "idempotence": "{{ 'yes' if changed_count|int == 0 else 'no' }}"
          }
        dest: "{{ results_file }}"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: results_file is defined
