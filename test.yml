---
# Test playbook for verifying macOS configuration

- name: "Verify macOS setup"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/main.yml
  vars:
    specific_role: "{{ lookup('env', 'TEST_ROLE') | default('') }}"
    run_all_tests: "{{ specific_role == '' }}"

  pre_tasks:
    - name: Display system information
      ansible.builtin.debug:
        msg: 
          - "macOS system information:"
          - "  - Architecture: {{ ansible_architecture }}"
          - "  - Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  - User: {{ main_username }}"
          - "  - Homebrew path: {{ homebrew_prefix }}"
          - "{% if specific_role %}  - Testing specific role: {{ specific_role }}{% else %}  - Testing all roles{% endif %}"
    
    - name: Verify macOS version compatibility
      ansible.builtin.debug:
        msg: "WARNING: This playbook is designed for macOS Monterey (12.0) or later. Current version: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      when: ansible_distribution == "MacOSX" and ansible_distribution_version is version('12.0', '<')

  roles:
    - role: adambware.test
      tags: ['test']
      when: run_all_tests

  tasks:
    # Run core system tests first
    - name: Run homebrew-install role tests
      ansible.builtin.include_tasks: roles/adambware.homebrew-install/tests/test_homebrew_install.yml
      when: run_all_tests or specific_role == 'adambware.homebrew-install'
      tags: ['homebrew-install', 'test-homebrew']

    - name: Run zsh role tests
      ansible.builtin.include_tasks: roles/adambware.zsh/tests/test_zsh.yml
      when: run_all_tests or specific_role == 'adambware.zsh'
      tags: ['zsh', 'test-zsh']
      
    # Run package manager tests
    - name: Run homebrew-packages role tests
      ansible.builtin.include_tasks: roles/adambware.homebrew-packages/tests/test_homebrew_packages.yml
      when: (run_all_tests or specific_role == 'adambware.homebrew-packages') and 
            hostvars['localhost']['homebrew_install_result'] is defined and 
            hostvars['localhost']['homebrew_install_result']
      tags: ['homebrew-packages', 'test-packages']
      
    - name: Run homebrew-casks role tests
      ansible.builtin.include_tasks: roles/adambware.homebrew-casks/tests/test_homebrew_casks.yml
      when: (run_all_tests or specific_role == 'adambware.homebrew-casks') and 
            hostvars['localhost']['homebrew_install_result'] is defined and 
            hostvars['localhost']['homebrew_install_result']
      tags: ['homebrew-casks', 'test-casks']
      
    # Run development environment tests
    - name: Run node role tests
      ansible.builtin.include_tasks: roles/adambware.node/tests/test_node.yml
      when: run_all_tests or specific_role == 'adambware.node'
      tags: ['node', 'test-node']
      
    - name: Run python role tests
      ansible.builtin.include_tasks: roles/adambware.python/tests/test_python.yml
      when: run_all_tests or specific_role == 'adambware.python'
      tags: ['python', 'test-python']
      
    - name: Run ruby role tests
      ansible.builtin.include_tasks: roles/adambware.ruby/tests/test_ruby.yml
      when: run_all_tests or specific_role == 'adambware.ruby'
      tags: ['ruby', 'test-ruby']
      
    # Run system configuration tests
    - name: Run OSX role tests
      ansible.builtin.include_tasks: roles/adambware.osx/tests/test_osx.yml
      when: run_all_tests or specific_role == 'adambware.osx'
      tags: ['osx', 'test-osx']
      
    - name: Run auto-updates role tests
      ansible.builtin.include_tasks: roles/adambware.auto-updates/tests/test_auto_updates.yml
      when: run_all_tests or specific_role == 'adambware.auto-updates'
      tags: ['auto-updates', 'test-updates']
      
    # Run private role tests last
    - name: Run private role tests
      ansible.builtin.include_tasks: roles/adambware.private/tests/test_private.yml
      when: 
        - setup_private_configs | default(true)
        - run_all_tests or specific_role == 'adambware.private'
      tags: ['private', 'test-private']

  post_tasks:
    - name: Generate test summary
      ansible.builtin.set_fact:
        test_summary:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          system:
            os_version: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
            architecture: "{{ ansible_architecture }}"
          results:
            all_tests_passed: "{{ hostvars['localhost']['all_tests_passed'] | default(true) }}"
            failed_tests: "{{ hostvars['localhost']['failed_tests'] | default([]) }}"
    
    - name: Save test summary to file
      ansible.builtin.copy:
        content: "{{ test_summary | to_nice_json }}"
        dest: "/tmp/test_summary_{{ ansible_date_time.date }}.json"
    
    - name: Test idempotence reminder
      ansible.builtin.debug:
        msg: |
          To test idempotence of the playbook, run:
          ./setup.sh --idempotence
          
          For a specific role:
          ./setup.sh --idempotence --role=ROLE_NAME
          
          This will help identify any tasks that might change when run multiple times.
          For detailed information on testing, see TESTING.md.

    - name: Show success message
      ansible.builtin.debug:
        msg: |
          {% if hostvars['localhost']['failed_tests'] is defined and hostvars['localhost']['failed_tests']|length > 0 %}
          ⚠️ Some tests failed. Please review the output above.
          
          Failed tests:
          {% for test in hostvars['localhost']['failed_tests'] %}
          - {{ test }}
          {% endfor %}
          
          Test summary saved to /tmp/test_summary_{{ ansible_date_time.date }}.json
          {% else %}
          ✅ All tests completed successfully! 🎉
          
          Test summary saved to /tmp/test_summary_{{ ansible_date_time.date }}.json
          {% endif %}
