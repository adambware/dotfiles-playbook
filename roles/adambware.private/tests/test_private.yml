---
# Tests for the private role
# Run with: ansible-playbook roles/adambware.private/tests/test_private.yml

- name: "Test private role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.private role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Test SSH configuration
    - name: Verify SSH directory permissions
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ssh"
      register: ssh_dir
      failed_when: not ssh_dir.stat.exists or ssh_dir.stat.mode != "0700"

    - name: Verify SSH keys
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ssh/{{ item.path | basename }}"
      with_items: "{{ ssh_keys_to_generate | default([]) }}"
      register: ssh_keys
      when: ssh_keys_to_generate is defined
      failed_when: not item.stat.exists

    - name: Verify SSH keys in agent
      ansible.builtin.shell: ssh-add -l
      register: ssh_agent_keys
      changed_when: false
      failed_when: false

    - name: Verify SSH known_hosts
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
      register: known_hosts
      failed_when: not known_hosts.stat.exists

    # Test Git configuration
    - name: Verify Git configuration
      ansible.builtin.command: git config --global --get {{ item.key }}
      register: git_config
      with_dict: "{{ private_git_config | default({}) }}"
      when: private_git_config is defined
      changed_when: false
      failed_when: git_config.rc != 0 or git_config.stdout != item.value

    - name: Verify global gitignore
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.gitignore_global"
      register: gitignore
      when: private_git_config is defined and private_git_config['core.excludesfile'] is defined
      failed_when: not gitignore.stat.exists

    # Test Homebrew packages and casks
    - name: Verify private homebrew packages
      ansible.builtin.shell: brew list --formula | grep "{{ item }}"
      register: brew_packages
      with_items: "{{ private_brew_packages | default([]) }}"
      when: private_brew_packages is defined
      changed_when: false
      failed_when: brew_packages.rc != 0

    - name: Verify private homebrew casks
      ansible.builtin.shell: brew list --cask | grep "{{ item }}"
      register: brew_casks
      with_items: "{{ private_brew_casks | default([]) }}"
      when: private_brew_casks is defined
      changed_when: false
      failed_when: brew_casks.rc != 0

    # Test configuration files
    - name: Verify configuration files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      register: config_files
      with_items: "{{ private_config_files | default([]) }}"
      when: private_config_files is defined
      failed_when: not config_files.stat.exists

    - name: Verify shell aliases
      ansible.builtin.shell: grep -q "# BEGIN PRIVATE SHELL ALIASES" "{{ ansible_env.HOME }}/.zshrc"
      register: shell_aliases
      when: private_shell_aliases is defined and private_shell_aliases | length > 0
      changed_when: false
      failed_when: shell_aliases.rc != 0

    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All private role tests passed!
          
          SSH configuration:
            - SSH directory: {{ "✅ OK" if ssh_dir.stat.exists and ssh_dir.stat.mode == "0700" else "❌ Failed" }}
            - SSH keys: {{ "✅ OK" if ssh_keys_to_generate is not defined or (ssh_keys.results | selectattr('failed_when_result', 'equalto', false) | list | length == ssh_keys.results | length) else "❌ Failed" }}
            - Known hosts: {{ "✅ OK" if known_hosts.stat.exists else "❌ Failed" }}
          
          Git configuration:
            - Git settings: {{ "✅ OK" if private_git_config is not defined or (git_config.results | selectattr('failed_when_result', 'equalto', false) | list | length == git_config.results | length) else "❌ Failed" }}
            - Global gitignore: {{ "✅ OK" if private_git_config is not defined or not private_git_config['core.excludesfile'] is defined or gitignore.stat.exists else "❌ Failed" }}
          
          Homebrew:
            - Packages: {{ "✅ OK" if private_brew_packages is not defined or (brew_packages.results | selectattr('failed_when_result', 'equalto', false) | list | length == brew_packages.results | length) else "❌ Failed" }}
            - Casks: {{ "✅ OK" if private_brew_casks is not defined or (brew_casks.results | selectattr('failed_when_result', 'equalto', false) | list | length == brew_casks.results | length) else "❌ Failed" }}
          
          Configuration:
            - Config files: {{ "✅ OK" if private_config_files is not defined or (config_files.results | selectattr('failed_when_result', 'equalto', false) | list | length == config_files.results | length) else "❌ Failed" }}
            - Shell aliases: {{ "✅ OK" if not (private_shell_aliases is defined and private_shell_aliases | length > 0) or shell_aliases.rc == 0 else "❌ Failed" }}
      when: ansible_check_mode
