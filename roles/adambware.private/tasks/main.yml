---
# tasks file for adambware.private

# Include Homebrew packages and casks tasks
- name: Set up Homebrew packages and casks
  ansible.builtin.include_tasks: homebrew.yml

# Include SSH key management tasks
- name: Set up SSH keys and configuration
  ansible.builtin.include_tasks: ssh.yml

# Include Git configuration tasks
- name: Set up Git configuration
  ansible.builtin.include_tasks: git.yml

# Include configuration files tasks
- name: Set up configuration files and shell aliases
  ansible.builtin.include_tasks: configs.yml
