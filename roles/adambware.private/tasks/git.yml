---
# Git configuration tasks

- name: Check existing Git config values
  ansible.builtin.command: git config --global --get {{ item.key }}
  register: git_config_check
  changed_when: false
  failed_when: false
  with_dict: "{{ private_git_config | default({}) }}"
  when: private_git_config is defined
  loop_control:
    label: "{{ item.key }}"

- name: Configure Git settings
  ansible.builtin.git_config:
    name: "{{ item.item.key }}"
    value: "{{ item.item.value }}"
    scope: global
  with_items: "{{ git_config_check.results | default([]) }}"
  when: 
    - private_git_config is defined
    - item.rc != 0 or (item.stdout | default('')) != item.item.value

- name: Check if global gitignore file exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.gitignore_global"
  register: gitignore_check
  when: private_git_config is defined and private_git_config['core.excludesfile'] is defined

- name: Get gitignore content if it exists
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.gitignore_global"
  register: gitignore_content
  when: 
    - private_git_config is defined 
    - private_git_config['core.excludesfile'] is defined
    - gitignore_check.stat.exists

- name: Create global gitignore file
  ansible.builtin.copy:
    content: |
      # macOS
      .DS_Store
      .AppleDouble
      .LSOverride
      ._*
      
      # IDE files
      .idea/
      .vscode/
      *.sublime-*
      
      # Node.js
      node_modules/
      npm-debug.log*
      
      # Python
      __pycache__/
      *.py[cod]
      *$py.class
      .env
      .venv
      env/
      venv/
      ENV/
      
      # Ruby
      *.gem
      *.rbc
      .bundle
      
      # Logs and databases
      *.log
      *.sql
      *.sqlite
    dest: "{{ ansible_env.HOME }}/.gitignore_global"
    mode: '0644'
    backup: yes
  when: 
    - private_git_config is defined 
    - private_git_config['core.excludesfile'] is defined
    - not gitignore_check.stat.exists or 
      (gitignore_content is defined and 
       gitignore_content.content | b64decode | trim != lookup('file', ansible_env.HOME + '/.gitignore_global') | trim)
