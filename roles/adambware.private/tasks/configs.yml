---
# Configuration files tasks

- name: Ensure configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  with_items:
    - "{{ ansible_env.HOME }}/.aws"
    - "{{ ansible_env.HOME }}/.config"
    - "{{ ansible_env.HOME }}/Library/Application Support/Code/User"

- name: Check if config files exist
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  register: config_file_check
  with_items: "{{ private_config_files | default([]) }}"
  when: private_config_files is defined
  loop_control:
    label: "{{ item.dest | basename }}"

- name: Compare existing config files with source
  ansible.builtin.command: diff -q "{{ item.item.src }}" "{{ item.item.dest }}"
  register: config_diff
  with_items: "{{ config_file_check.results | default([]) }}"
  when: 
    - private_config_files is defined
    - item.stat.exists | default(false)
  failed_when: false
  changed_when: false
  loop_control:
    label: "{{ item.item.dest | basename }}"

- name: Copy private configuration files
  ansible.builtin.copy:
    src: "{{ item.item.item.src }}"
    dest: "{{ item.item.item.dest }}"
    mode: "{{ item.item.item.mode }}"
    backup: yes
  with_items: "{{ config_diff.results | default([]) }}"
  when: 
    - private_config_files is defined
    - item.rc != 0 or not item.item.stat.exists

- name: Check if shell aliases block exists
  ansible.builtin.shell: grep -q "# BEGIN PRIVATE SHELL ALIASES" "{{ ansible_env.HOME }}/.zshrc" || echo "not found"
  register: shell_aliases_check
  changed_when: false
  failed_when: false
  when: private_shell_aliases is defined and private_shell_aliases | length > 0

- name: Get current shell aliases block
  ansible.builtin.shell: sed -n '/# BEGIN PRIVATE SHELL ALIASES/,/# END PRIVATE SHELL ALIASES/p' "{{ ansible_env.HOME }}/.zshrc"
  register: current_aliases
  changed_when: false
  failed_when: false
  when: 
    - private_shell_aliases is defined 
    - private_shell_aliases | length > 0
    - shell_aliases_check.stdout != "not found"

- name: Prepare expected aliases block
  ansible.builtin.set_fact:
    expected_aliases: "# BEGIN PRIVATE SHELL ALIASES\n{{ private_shell_aliases | join('\n') }}\n# END PRIVATE SHELL ALIASES"
  when: 
    - private_shell_aliases is defined 
    - private_shell_aliases | length > 0

- name: Add private shell aliases to shell config
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} PRIVATE SHELL ALIASES"
    block: "{{ private_shell_aliases | join('\n') }}"
    create: yes
  when: 
    - private_shell_aliases is defined 
    - private_shell_aliases | length > 0
    - shell_aliases_check.stdout == "not found" or 
      (current_aliases.stdout | replace('\r\n', '\n') | replace('\n\n', '\n') | trim != 
       expected_aliases | replace('\r\n', '\n') | replace('\n\n', '\n') | trim)
