---
# SSH key management tasks

- name: Ensure SSH directory exists with proper permissions
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: '0700'

- name: Check if SSH keys exist
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.ssh/{{ item.dest | basename }}"
  register: ssh_key_check
  with_items: "{{ private_ssh_keys | default([]) }}"
  when: private_ssh_keys is defined
  loop_control:
    label: "{{ item.dest | basename }}"

- name: Copy existing private SSH keys
  ansible.builtin.copy:
    src: "{{ item.item.src }}"
    dest: "{{ item.item.dest }}"
    mode: "{{ item.item.mode }}"
  with_items: "{{ ssh_key_check.results | default([]) }}"
  when: 
    - private_ssh_keys is defined
    - item.stat is defined
    - not item.stat.exists

- name: Generate new SSH keys if not existing and not provided
  ansible.builtin.command: >
    ssh-keygen -t {{ item.type | default('ed25519') }} 
    -f {{ item.path }} 
    -N "{{ item.passphrase | default('') }}" 
    -C "{{ item.comment | default('generated by ansible') }}"
  args:
    creates: "{{ item.path }}"
  with_items: "{{ ssh_keys_to_generate | default([]) }}"
  when:
    - ssh_keys_to_generate is defined
    - not ansible_check_mode

- name: Check if SSH agent is running
  ansible.builtin.shell: ssh-add -l
  environment:
    SSH_AUTH_SOCK: "{{ ansible_env.SSH_AUTH_SOCK }}"
  register: ssh_agent_check
  changed_when: false
  failed_when: false

- name: Parse SSH keys currently in agent
  ansible.builtin.set_fact:
    agent_keys: "{{ ssh_agent_check.stdout_lines | default([]) }}"
  when: ssh_agent_check.rc == 0

- name: Check if keys are already in agent
  ansible.builtin.shell: ssh-add -l | grep -q "$(ssh-keygen -lf {{ item }} | awk '{print $2}')"
  args:
    executable: /bin/zsh
  environment:
    SSH_AUTH_SOCK: "{{ ansible_env.SSH_AUTH_SOCK }}"
  register: key_in_agent
  with_items: "{{ ssh_keys_to_add_to_agent | default([]) }}"
  changed_when: false
  failed_when: false
  when:
    - ssh_keys_to_add_to_agent is defined
    - ansible_env.SSH_AUTH_SOCK is defined
    - ssh_agent_check.rc == 0
    - not ansible_check_mode

- name: Add SSH keys to SSH agent if not present
  ansible.builtin.shell: |
    ssh-add {{ item.item }}
  args:
    executable: /bin/zsh
  environment:
    SSH_AUTH_SOCK: "{{ ansible_env.SSH_AUTH_SOCK }}"
  with_items: "{{ key_in_agent.results | default([]) }}"
  when:
    - ssh_keys_to_add_to_agent is defined
    - ansible_env.SSH_AUTH_SOCK is defined
    - not ansible_check_mode
    - item.rc != 0  # Only add if key is not already in agent
  register: ssh_add_result
  changed_when: "'Identity added' in ssh_add_result.stdout"

- name: Ensure known_hosts file exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  changed_when: false

- name: Check if hosts are already in known_hosts
  ansible.builtin.shell: ssh-keygen -F {{ item.hostname }}
  args:
    executable: /bin/bash
  register: known_hosts_check
  changed_when: false
  failed_when: false
  with_items: "{{ ssh_known_hosts | default([]) }}"
  when: ssh_known_hosts is defined

- name: Add host keys to known_hosts
  ansible.builtin.known_hosts:
    name: "{{ item.item.hostname }}"
    key: "{{ item.item.key | default(omit) }}"
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    state: present
  with_items: "{{ known_hosts_check.results | default([]) }}"
  when: 
    - ssh_known_hosts is defined
    - item.rc != 0  # Only add if host is not already in known_hosts

- name: Configure SSH config file
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    backup: yes
  with_items: "{{ private_ssh_keys | default([]) }}"
  when: 
    - private_ssh_keys is defined
    - item.dest | basename == 'config'
