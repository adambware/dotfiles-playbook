---
# tasks file for adambware.test

# Core system checks
- name: Verify Homebrew installation
  ansible.builtin.command: which brew
  register: brew_check
  changed_when: false
  failed_when: brew_check.rc != 0

- name: Verify ZSH installation
  ansible.builtin.command: which zsh
  register: zsh_check
  changed_when: false
  failed_when: zsh_check.rc != 0

- name: Verify default shell
  ansible.builtin.shell: echo $SHELL
  register: shell_check
  changed_when: false
  failed_when: zsh_path not in shell_check.stdout

# Development environment checks
- name: Verify Node.js installation
  ansible.builtin.command: which node
  register: node_check
  changed_when: false
  failed_when: node_check.rc != 0

- name: Verify npm installation
  ansible.builtin.command: which npm
  register: npm_check
  changed_when: false
  failed_when: npm_check.rc != 0

- name: Check Node.js version
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false
  failed_when: node_version.rc != 0

- name: Verify Ruby installation
  ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && eval "$(rbenv init -)" && which ruby
  args:
    executable: /bin/zsh
  register: ruby_check
  changed_when: false
  failed_when: ruby_check.rc != 0

- name: Check Ruby version
  ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && eval "$(rbenv init -)" && ruby --version
  args:
    executable: /bin/zsh
  register: ruby_version
  changed_when: false
  failed_when: ruby_version.rc != 0

- name: Verify Python installation
  ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && eval "$(pyenv init -)" && which python
  args:
    executable: /bin/zsh
  register: python_check
  changed_when: false
  failed_when: python_check.rc != 0
  ignore_errors: true

- name: Check Python version
  ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && eval "$(pyenv init -)" && python --version
  args:
    executable: /bin/zsh
  register: python_version
  changed_when: false
  failed_when: python_version.rc != 0
  ignore_errors: true

# Homebrew packages and casks verification
- name: Verify Homebrew packages
  ansible.builtin.shell: brew list --formula | grep "{{ item }}"
  register: pkg_check
  changed_when: false
  failed_when: pkg_check.rc != 0
  with_items:
    - git
    - wget
    - curl

- name: Verify Homebrew casks
  ansible.builtin.shell: brew list --cask | grep "{{ item }}"
  register: cask_check
  changed_when: false
  failed_when: cask_check.rc != 0
  with_items:
    - iterm2
    - visual-studio-code

# Shell configuration verification
- name: Verify Oh My Zsh installation
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: ohmyzsh_check
  failed_when: not ohmyzsh_check.stat.exists

- name: Verify ZSH theme
  ansible.builtin.shell: grep "ZSH_THEME=" {{ ansible_env.HOME }}/.zshrc
  register: zsh_theme_check
  changed_when: false
  failed_when: zsh_theme_check.rc != 0

# macOS settings verification
- name: Verify some macOS settings
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    state: present
  register: settings_check
  with_items:
    - { domain: "com.apple.dock", key: "autohide" }
    - { domain: "NSGlobalDomain", key: "AppleShowAllExtensions" }
  changed_when: false

# Path configuration verification
- name: Verify Homebrew in PATH
  ansible.builtin.shell: echo $PATH | grep "{{ homebrew_bin }}"
  register: brew_path_check
  changed_when: false
  failed_when: brew_path_check.rc != 0

# Success verification
- name: Verify macOS settings
  ansible.builtin.debug:
    msg: |
      ✅ All systems are functioning normally! 🚀
      
      System details:
        - macOS version: {{ ansible_distribution_version }}
        - Architecture: {{ ansible_architecture }}
        - Homebrew: {{ brew_check.stdout }}
        - Shell: {{ shell_check.stdout }}
        - Node.js: {{ node_version.stdout | default('Not installed') }}
        - Ruby: {{ ruby_version.stdout | default('Not installed') }}
        - Python: {{ python_version.stdout | default('Not installed') }}
  when: brew_check.rc == 0 and zsh_check.rc == 0
