---
# defaults file for adambware.python

# Latest stable Python version as of June 2025
python_version: "3.12.0"

# Path to pyenv installation
pyenv_root: "{{ ansible_env.HOME }}/.pyenv"

# Common Python packages to install
python_packages:
  - ipython
  - jupyter
  - black
  - flake8
  - pylint
  - pytest
  - requests
  - pyyaml
  - pipenv
  - poetry
