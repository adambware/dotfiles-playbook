---
# Tests for the python role

- name: "Test python role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.python role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Verify pyenv installation
    - name: Verify pyenv is installed
      ansible.builtin.stat:
        path: "{{ pyenv_root }}/bin/pyenv"
      register: pyenv_check
      failed_when: not pyenv_check.stat.exists
      
    - name: Verify pyenv executable permissions
      ansible.builtin.stat:
        path: "{{ pyenv_root }}/bin/pyenv"
      register: pyenv_exec_check
      failed_when: not pyenv_exec_check.stat.executable
      when: pyenv_check.stat.exists
      
    - name: Verify pyenv version
      ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && pyenv --version
      args:
        executable: /bin/zsh
      register: pyenv_version
      changed_when: false
      failed_when: pyenv_version.rc != 0
      when: pyenv_check.stat.exists
      
    # Verify Python installations
    - name: Get installed Python versions
      ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && pyenv versions --bare
      args:
        executable: /bin/zsh
      register: python_versions
      changed_when: false
      failed_when: python_versions.rc != 0
      when: pyenv_check.stat.exists
      
    - name: Verify default Python version
      ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && pyenv global
      args:
        executable: /bin/zsh
      register: python_global
      changed_when: false
      failed_when: python_global.rc != 0
      when: pyenv_check.stat.exists
      
    # Verify Python packages
    - name: Verify pip is installed
      ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && pip --version
      args:
        executable: /bin/zsh
      register: pip_check
      changed_when: false
      failed_when: pip_check.rc != 0
      when: pyenv_check.stat.exists
      
    - name: Get list of installed pip packages
      ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && pip list
      args:
        executable: /bin/zsh
      register: pip_packages
      changed_when: false
      failed_when: pip_packages.rc != 0
      when: pyenv_check.stat.exists
      
    # Verify shell configuration
    - name: Verify pyenv in shell configuration
      ansible.builtin.shell: grep -q "pyenv init" {{ ansible_env.HOME }}/.zshrc
      register: pyenv_shell_check
      changed_when: false
      failed_when: pyenv_shell_check.rc != 0
      
    # Architecture-specific tests
    - name: Verify Apple Silicon specific configurations
      block:
        - name: Check Python architecture
          ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && python3 -c "import platform; print(platform.machine())"
          args:
            executable: /bin/zsh
          register: python_arch_check
          changed_when: false
          failed_when: python_arch_check.rc != 0 or "arm64" not in python_arch_check.stdout
      when: ansible_architecture == "arm64" and pyenv_check.stat.exists
      
    - name: Verify Intel specific configurations
      block:
        - name: Check Python architecture
          ansible.builtin.shell: export PYENV_ROOT="{{ pyenv_root }}" && export PATH="$PYENV_ROOT/bin:$PATH" && eval "$(pyenv init -)" && python3 -c "import platform; print(platform.machine())"
          args:
            executable: /bin/zsh
          register: python_arch_check
          changed_when: false
          failed_when: python_arch_check.rc != 0 or "x86_64" not in python_arch_check.stdout
      when: ansible_architecture == "x86_64" and pyenv_check.stat.exists
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All python role tests passed!
          
          pyenv installation:
            - pyenv exists: {{ "✅ OK" if pyenv_check.stat.exists else "❌ Failed" }}
            - pyenv executable: {{ "✅ OK" if pyenv_exec_check.stat.executable | default(false) else "❌ Failed" }}
            - pyenv version: {{ pyenv_version.stdout if pyenv_version.rc == 0 else "❌ Failed" }}
            
          Python installations:
            - Installed versions: 
              {% for version in python_versions.stdout_lines | default([]) %}
              * {{ version }}
              {% endfor %}
            - Global version: {{ python_global.stdout if python_global.rc == 0 else "❌ Failed" }}
            
          Python configuration:
            - pip: {{ "✅ OK" if pip_check.rc == 0 else "❌ Failed" }}
            - Shell integration: {{ "✅ OK" if pyenv_shell_check.rc == 0 else "❌ Failed" }}
            
          Architecture-specific tests:
            {% if ansible_architecture == "arm64" %}
            - Apple Silicon architecture: {{ "✅ OK" if python_arch_check.rc == 0 and "arm64" in python_arch_check.stdout else "❌ Failed" }}
            {% else %}
            - Intel architecture: {{ "✅ OK" if python_arch_check.rc == 0 and "x86_64" in python_arch_check.stdout else "❌ Failed" }}
            {% endif %}
