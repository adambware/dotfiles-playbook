---
# Tests for the homebrew-packages role

- name: "Test homebrew-packages role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.homebrew-packages role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Set facts for homebrew installed status
    - name: Set fact for homebrew installed status
      ansible.builtin.set_fact:
        homebrew_install_result: true
    
    # Verify Core Packages
    - name: Get list of installed packages
      ansible.builtin.command: brew list --formula
      register: installed_packages
      changed_when: false
      
    - name: Verify essential packages are installed
      ansible.builtin.assert:
        that: item in installed_packages.stdout_lines
        fail_msg: "Package {{ item }} is not installed"
        success_msg: "Package {{ item }} is installed"
      with_items:
        - git
        - wget
        - curl
        - coreutils
      register: essential_packages_check
      
    # Verify Package Versions
    - name: Get package versions
      ansible.builtin.command: "brew info --json=v1 {{ item }}"
      register: package_versions
      changed_when: false
      with_items:
        - git
        - wget
        - curl
      
    # Verify Tap Repositories
    - name: Get list of installed taps
      ansible.builtin.command: brew tap
      register: installed_taps
      changed_when: false
      
    - name: Verify essential taps are installed
      ansible.builtin.assert:
        that: item in installed_taps.stdout_lines
        fail_msg: "Tap {{ item }} is not installed"
        success_msg: "Tap {{ item }} is installed"
      with_items:
        - homebrew/core
        - homebrew/cask
      register: essential_taps_check
      
    # Verify Package Configurations
    - name: Check if git is configured correctly
      ansible.builtin.command: git --version
      register: git_version
      changed_when: false
      failed_when: git_version.rc != 0
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ Homebrew packages tests completed!
          
          Installed packages (showing first 10):
          {% for package in installed_packages.stdout_lines[:10] %}
          - {{ package }}
          {% endfor %}
          {% if installed_packages.stdout_lines | length > 10 %}
          ... and {{ installed_packages.stdout_lines | length - 10 }} more
          {% endif %}
          
          Essential packages:
          - git: {{ "✅ OK" if "git" in installed_packages.stdout_lines else "❌ Failed" }}
          - wget: {{ "✅ OK" if "wget" in installed_packages.stdout_lines else "❌ Failed" }}
          - curl: {{ "✅ OK" if "curl" in installed_packages.stdout_lines else "❌ Failed" }}
          - coreutils: {{ "✅ OK" if "coreutils" in installed_packages.stdout_lines else "❌ Failed" }}
          
          Installed taps:
          {% for tap in installed_taps.stdout_lines %}
          - {{ tap }}
          {% endfor %}
          
          Git version: {{ git_version.stdout if git_version.rc == 0 else "❌ Failed" }}
