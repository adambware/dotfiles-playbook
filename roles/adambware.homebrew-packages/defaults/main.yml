---
# defaults file for adambware.homebrew-packages

# Homebrew taps to add
brew_taps:
  - homebrew/core
  - homebrew/cask
  - homebrew/cask-fonts

# Common Homebrew packages to install
brew_packages:
  # Shell utilities
  - jq
  - htop
  - tmux
  - ripgrep
  
  # Development tools
  - git
  - git-lfs
  - gh
  
  # Cloud and infrastructure
  - kubectl
  
  # Security tools
  - gnupg
  - openssh
