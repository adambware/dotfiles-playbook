---
# defaults file for adambware.homebrew-packages

# Homebrew taps to add
brew_taps:
  - homebrew/core
  - homebrew/cask
  - homebrew/cask-fonts

# Common Homebrew packages to install
brew_packages:
  # Shell utilities
  - bash
  - zsh
  - wget
  - curl
  - jq
  - yq
  - htop
  - tmux
  - tree
  - ripgrep
  - fd
  - bat
  - fzf
  - exa
  
  # Development tools
  - git
  - git-lfs
  - gh
  - neovim
  - vim
  
  # Languages and runtimes
  - python
  - pyenv
  - rbenv
  - ruby-build
  - go
  - node
  
  # Cloud and infrastructure
  - awscli
  - terraform
  - kubectl
  
  # Security tools
  - gnupg
  - openssh
