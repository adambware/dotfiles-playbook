---
# handlers file for adambware.osx

- name: restart dock
  ansible.builtin.command: killall Dock
  changed_when: true
  failed_when: false  # Don't fail if Dock isn't running
  listen: "restart ui services"

- name: restart finder
  ansible.builtin.command: killall Finder
  changed_when: true
  failed_when: false  # Don't fail if Finder isn't running
  listen: "restart ui services"

- name: restart systemuiserver
  ansible.builtin.command: killall SystemUIServer
  changed_when: true
  failed_when: false  # Don't fail if SystemUIServer isn't running
  listen: "restart ui services"

- name: restart cfprefsd
  ansible.builtin.command: killall cfprefsd
  changed_when: true
  failed_when: false  # Don't fail if cfprefsd isn't running
  listen: "restart ui services"
