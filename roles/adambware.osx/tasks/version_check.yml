---
# Version detection and compatibility tasks

- name: Get macOS version information
  ansible.builtin.set_fact:
    macos_major_version: "{{ ansible_distribution_version.split('.')[0] | int }}"
    macos_minor_version: "{{ ansible_distribution_version.split('.')[1] | default(0) | int }}"
    macos_version_name: >-
      {% if ansible_distribution_version is version('14', '>=') %}
      sonoma
      {% elif ansible_distribution_version is version('13', '>=') %}
      ventura
      {% elif ansible_distribution_version is version('12', '>=') %}
      monterey
      {% elif ansible_distribution_version is version('11', '>=') %}
      bigsur
      {% else %}
      unsupported
      {% endif %}

- name: Check macOS version compatibility
  ansible.builtin.debug:
    msg: >-
      WARNING: This role is optimized for macOS Monterey (12.0) or later.
      You are running macOS {{ ansible_distribution_version }} ({{ macos_version_name | capitalize }})
      which may not be fully supported.
  when: macos_version_name == 'unsupported'
