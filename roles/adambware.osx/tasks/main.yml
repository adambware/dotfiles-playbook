---
# tasks file for adambware.osx

# Modernized and modular macOS settings

# Detect macOS version and set feature flags
- name: Check macOS version and set feature flags
  ansible.builtin.include_tasks: version_check.yml
  tags: ['osx', 'osx-version']

- name: Include General UI/UX settings
  ansible.builtin.include_tasks: general_ui.yml
  tags: ['osx', 'osx-ui']

- name: Include Input device settings
  ansible.builtin.include_tasks: input_devices.yml
  tags: ['osx', 'osx-input']

- name: Include Screen settings
  ansible.builtin.include_tasks: screen.yml
  tags: ['osx', 'osx-screen']

- name: Include Finder settings
  ansible.builtin.include_tasks: finder.yml
  tags: ['osx', 'osx-finder']

- name: Include Dock settings
  ansible.builtin.include_tasks: dock.yml
  tags: ['osx', 'osx-dock']

- name: Include Safari settings
  ansible.builtin.include_tasks: safari.yml
  tags: ['osx', 'osx-safari']

- name: Include Security settings
  ansible.builtin.include_tasks: security.yml
  tags: ['osx', 'osx-security']

# Notify changes to UI services at the end
- name: Notify UI services of changes
  ansible.builtin.debug:
    msg: "UI changes have been applied and will be active after service restarts"
  changed_when: true
  notify: "restart ui services"
