---
# Trackpad, mouse, keyboard, Bluetooth accessories, and input settings

- name: Set input device preferences
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    # Improve Bluetooth audio quality
    - { domain: "com.apple.BluetoothAudioAgent", key: "Apple Bitpool Min (editable)", type: "int", value: 40 }
    # Enable full keyboard access for all controls
    - { domain: "NSGlobalDomain", key: "AppleKeyboardUIMode", type: "int", value: 3 }
    # Disable auto-correct
    - { domain: "NSGlobalDomain", key: "NSAutomaticSpellingCorrectionEnabled", type: "bool", value: false }
    # Additional customizable keyboard settings
    - { domain: "NSGlobalDomain", key: "NSAutomaticCapitalizationEnabled", type: "bool", value: "{{ keyboard_auto_capitalize | default(false) }}" }
    - { domain: "NSGlobalDomain", key: "NSAutomaticDashSubstitutionEnabled", type: "bool", value: "{{ keyboard_auto_smart_dashes | default(false) }}" }
    - { domain: "NSGlobalDomain", key: "NSAutomaticPeriodSubstitutionEnabled", type: "bool", value: "{{ keyboard_auto_smart_periods | default(false) }}" }
    - { domain: "NSGlobalDomain", key: "NSAutomaticQuoteSubstitutionEnabled", type: "bool", value: "{{ keyboard_auto_smart_quotes | default(false) }}" }
  when: configure_input_devices | default(true)

# Configure trackpad settings if enabled
- name: Configure trackpad settings
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    # Enable tap to click
    - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "Clicking", type: "int", value: "{{ 1 if trackpad_tap_to_click else 0 }}" }
    - { domain: "NSGlobalDomain", key: "com.apple.mouse.tapBehavior", type: "int", value: "{{ 1 if trackpad_tap_to_click else 0 }}" }
    # Enable secondary click (right-click)
    - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "TrackpadRightClick", type: "bool", value: "{{ trackpad_right_click | default(true) }}" }
    - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "TrackpadCornerSecondaryClick", type: "int", value: "{{ trackpad_corner_secondary_click | default(0) }}" }
  when: configure_trackpad | default(true)
