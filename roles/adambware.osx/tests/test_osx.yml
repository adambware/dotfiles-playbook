---
# Test playbook for verifying macOS settings

- name: "Test macOS settings"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../defaults/main.yml

  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.osx role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Test General UI settings
    - name: Verify dark mode setting
      ansible.builtin.command: defaults read NSGlobalDomain AppleInterfaceStyle
      register: dark_mode_check
      changed_when: false
      failed_when: 
        - enable_dark_mode 
        - dark_mode_check.stdout != "Dark"
      ignore_errors: true

    # Test Finder settings
    - name: Verify Finder settings
      ansible.builtin.command: defaults read com.apple.finder {{ item.key }}
      register: finder_settings
      loop:
        - { key: "ShowStatusBar", expected: "1" }
        - { key: "_FXShowPosixPathInTitle", expected: "1" }
        - { key: "FXPreferredViewStyle", expected: "{{ finder_default_view }}" }
      changed_when: false
      failed_when: finder_settings.stdout != item.expected
      ignore_errors: true

    # Test Dock settings
    - name: Verify Dock settings
      ansible.builtin.command: defaults read com.apple.dock {{ item.key }}
      register: dock_settings
      loop:
        - { key: "orientation", expected: "{{ dock_position }}" }
        - { key: "autohide", expected: "{{ 1 if dock_auto_hide else 0 }}" }
        - { key: "magnification", expected: "{{ 1 if dock_magnification else 0 }}" }
      changed_when: false
      failed_when: dock_settings.stdout != item.expected | string
      ignore_errors: true

    # Test Screenshot settings
    - name: Verify screenshot settings
      ansible.builtin.command: defaults read com.apple.screencapture {{ item.key }}
      register: screenshot_settings
      loop:
        - { key: "location", expected: "{{ screenshot_location }}" }
        - { key: "type", expected: "{{ screenshot_format }}" }
      changed_when: false
      failed_when: screenshot_settings.stdout != item.expected
      ignore_errors: true

    # Test File visibility
    - name: Check Library folder visibility
      ansible.builtin.command: ls -lO "{{ ansible_env.HOME }}" | grep Library
      register: library_visibility
      changed_when: false
      failed_when: "hidden" in library_visibility.stdout
      ignore_errors: true

    # Display test results
    - name: Summarize test results
      ansible.builtin.debug:
        msg: |
          macOS Settings Test Results:
          
          General UI:
            - Dark Mode: {{ "✅ OK" if not enable_dark_mode or dark_mode_check.stdout == "Dark" else "❌ Failed" }}
          
          Finder:
            - Status Bar: {{ "✅ OK" if finder_settings.results[0].stdout == "1" else "❌ Failed" }}
            - Path in Title: {{ "✅ OK" if finder_settings.results[1].stdout == "1" else "❌ Failed" }}
            - View Style: {{ "✅ OK" if finder_settings.results[2].stdout == finder_default_view else "❌ Failed" }}
          
          Dock:
            - Position: {{ "✅ OK" if dock_settings.results[0].stdout == dock_position else "❌ Failed" }}
            - Auto-hide: {{ "✅ OK" if (dock_settings.results[1].stdout == "1" and dock_auto_hide) or (dock_settings.results[1].stdout == "0" and not dock_auto_hide) else "❌ Failed" }}
            - Magnification: {{ "✅ OK" if (dock_settings.results[2].stdout == "1" and dock_magnification) or (dock_settings.results[2].stdout == "0" and not dock_magnification) else "❌ Failed" }}
          
          Screenshot:
            - Location: {{ "✅ OK" if screenshot_settings.results[0].stdout == screenshot_location else "❌ Failed" }}
            - Format: {{ "✅ OK" if screenshot_settings.results[1].stdout == screenshot_format else "❌ Failed" }}
          
          File Visibility:
            - Library Folder: {{ "✅ OK" if "hidden" not in library_visibility.stdout else "❌ Failed" }}
          
          Security:
            - FileVault: {{ "✅ OK" if not enable_filevault or 'FileVault is On' in filevault_status.stdout else "❌ Failed" }}
      ignore_errors: true
