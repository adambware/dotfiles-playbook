---
# Tests for the node role

- name: "Test node role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.node role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Verify Node.js installation
    - name: Verify Node.js is installed
      ansible.builtin.command: which node
      register: node_check
      changed_when: false
      failed_when: node_check.rc != 0
      
    - name: Verify Node.js version
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false
      failed_when: node_version.rc != 0
      
    - name: Verify npm is installed
      ansible.builtin.command: which npm
      register: npm_check
      changed_when: false
      failed_when: npm_check.rc != 0
      
    - name: Verify npm version
      ansible.builtin.command: npm --version
      register: npm_version
      changed_when: false
      failed_when: npm_version.rc != 0
      
    # Verify global packages
    - name: Get list of globally installed npm packages
      ansible.builtin.command: npm list -g --depth=0
      register: npm_global_packages
      changed_when: false
      failed_when: npm_global_packages.rc != 0
      
    - name: Verify essential npm packages are installed
      ansible.builtin.assert:
        that: npm_global_packages.stdout is search(item)
        fail_msg: "Package {{ item }} is not installed globally"
        success_msg: "Package {{ item }} is installed globally"
      with_items:
        - "npm"
      register: essential_npm_packages_check
      ignore_errors: true
      
    # Verify Node.js configuration
    - name: Verify Node.js in PATH
      ansible.builtin.shell: echo $PATH | grep -q "node"
      register: node_path_check
      changed_when: false
      failed_when: false
      
    # Verify nvm if it's being used
    - name: Check if nvm is installed
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
      register: nvm_check
      
    - name: Verify nvm configuration
      ansible.builtin.shell: . {{ ansible_env.HOME }}/.nvm/nvm.sh && nvm --version
      register: nvm_version
      changed_when: false
      failed_when: nvm_version.rc != 0
      when: nvm_check.stat.exists
      
    # Architecture-specific tests
    - name: Verify Apple Silicon specific configurations
      block:
        - name: Check Node.js architecture
          ansible.builtin.shell: file $(which node)
          register: node_arch_check
          changed_when: false
          failed_when: node_arch_check.rc != 0 or "arm64" not in node_arch_check.stdout
      when: ansible_architecture == "arm64"
      
    - name: Verify Intel specific configurations
      block:
        - name: Check Node.js architecture
          ansible.builtin.shell: file $(which node)
          register: node_arch_check
          changed_when: false
          failed_when: node_arch_check.rc != 0 or "x86_64" not in node_arch_check.stdout
      when: ansible_architecture == "x86_64"
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All node role tests passed!
          
          Node.js installation:
            - Node.js command: {{ "✅ OK" if node_check.rc == 0 else "❌ Failed" }}
            - Node.js version: {{ node_version.stdout if node_version.rc == 0 else "❌ Failed" }}
            - npm command: {{ "✅ OK" if npm_check.rc == 0 else "❌ Failed" }}
            - npm version: {{ npm_version.stdout if npm_version.rc == 0 else "❌ Failed" }}
            
          Node.js global packages:
            - Essential packages: {{ "✅ OK" if essential_npm_packages_check.failed == false else "❌ Missing some packages" }}
            
          Node.js configuration:
            - PATH configuration: {{ "✅ OK" if node_path_check.rc == 0 else "⚠️ Node not in PATH" }}
            {% if nvm_check.stat.exists %}
            - nvm version: {{ nvm_version.stdout if nvm_version.rc == 0 else "❌ Failed" }}
            {% endif %}
            
          Architecture-specific tests:
            {% if ansible_architecture == "arm64" %}
            - Apple Silicon architecture: {{ "✅ OK" if node_arch_check.rc == 0 and "arm64" in node_arch_check.stdout else "❌ Failed" }}
            {% else %}
            - Intel architecture: {{ "✅ OK" if node_arch_check.rc == 0 and "x86_64" in node_arch_check.stdout else "❌ Failed" }}
            {% endif %}
