---
# tasks file for adambware.node

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  when: not ansible_check_mode

- name: Check if n is installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.n"
  register: n_check

- name: Install n (Node Version Manager)
  ansible.builtin.shell: >
    curl -L https://git.io/n-install | bash -s -- -y {{ node_lts_version }}
  args:
    creates: "{{ ansible_env.HOME }}/.n"
  when: not n_check.stat.exists and not ansible_check_mode
  
- name: Set up n in shell config
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} NODE VERSION MANAGER CONFIGURATION"
    block: |
      export N_PREFIX="$HOME/.n"
      export PATH="$N_PREFIX/bin:$PATH"
    create: yes
    
- name: Check if global npm packages are installed
  ansible.builtin.shell: npm list -g --depth=0 | grep "{{ item }}"
  args:
    executable: /bin/bash
  register: npm_packages_check
  changed_when: false
  failed_when: false
  with_items: "{{ npm_global_packages }}"
    
- name: Install global npm packages
  community.general.npm:
    name: "{{ item.item }}"
    global: yes
  with_items: "{{ npm_packages_check.results }}"
  when: item.rc != 0 and not ansible_check_mode
