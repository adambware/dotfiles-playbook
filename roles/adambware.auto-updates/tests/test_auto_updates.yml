---
# Tests for the auto-updates role

- name: "Test auto-updates role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.auto-updates role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Verify Software Update settings
    - name: Check automatic update settings
      ansible.builtin.command: defaults read /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled
      register: auto_check
      changed_when: false
      failed_when: auto_check.rc != 0
      
    - name: Check automatic download settings
      ansible.builtin.command: defaults read /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload
      register: auto_download
      changed_when: false
      failed_when: auto_download.rc != 0
      
    - name: Check critical update install settings
      ansible.builtin.command: defaults read /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall
      register: critical_update
      changed_when: false
      failed_when: critical_update.rc != 0
      
    - name: Check background check frequency
      ansible.builtin.command: defaults read /Library/Preferences/com.apple.SoftwareUpdate ScheduleFrequency
      register: schedule_frequency
      changed_when: false
      failed_when: schedule_frequency.rc != 0
      
    # Verify App Store auto-update settings
    - name: Check App Store auto-update settings
      ansible.builtin.command: defaults read /Library/Preferences/com.apple.commerce AutoUpdate
      register: app_store_auto
      changed_when: false
      failed_when: app_store_auto.rc != 0
      
    # Verify OS-specific configurations
    - name: Check OS version specific settings
      ansible.builtin.debug:
        msg: "Testing auto-update settings for macOS {{ ansible_distribution_version }}"
      
    # macOS version-specific tests
    - name: Check macOS Monterey specific settings
      block:
        - name: Verify App Store update settings on Monterey
          ansible.builtin.command: defaults read /Library/Preferences/com.apple.storeagent AutoUpdateRestartRequired
          register: monterey_update
          changed_when: false
          failed_when: false
      when: ansible_distribution_version is version('12.0', '>=') and ansible_distribution_version is version('13.0', '<')
      
    - name: Check macOS Ventura specific settings
      block:
        - name: Verify App Store update settings on Ventura
          ansible.builtin.command: defaults read /Library/Preferences/com.apple.storeagent AutoUpdateRestartRequired
          register: ventura_update
          changed_when: false
          failed_when: false
      when: ansible_distribution_version is version('13.0', '>=') and ansible_distribution_version is version('14.0', '<')
      
    - name: Check macOS Sonoma specific settings
      block:
        - name: Verify App Store update settings on Sonoma
          ansible.builtin.command: defaults read /Library/Preferences/com.apple.storeagent AutoUpdateRestartRequired
          register: sonoma_update
          changed_when: false
          failed_when: false
      when: ansible_distribution_version is version('14.0', '>=')
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All auto-updates role tests passed!
          
          Software Update settings:
            - Automatic check: {{ "✅ Enabled (1)" if auto_check.stdout == "1" else "❌ Disabled (0)" }}
            - Automatic download: {{ "✅ Enabled (1)" if auto_download.stdout == "1" else "❌ Disabled (0)" }}
            - Critical update install: {{ "✅ Enabled (1)" if critical_update.stdout == "1" else "❌ Disabled (0)" }}
            - Check frequency: {{ schedule_frequency.stdout }} day(s)
            
          App Store settings:
            - Auto-update: {{ "✅ Enabled (1)" if app_store_auto.stdout == "1" else "❌ Disabled (0)" }}
            
          macOS version-specific settings:
            {% if ansible_distribution_version is version('12.0', '>=') and ansible_distribution_version is version('13.0', '<') %}
            - Monterey restart after update: {{ monterey_update.stdout if monterey_update is defined and monterey_update.rc == 0 else "❌ Not configured" }}
            {% elif ansible_distribution_version is version('13.0', '>=') and ansible_distribution_version is version('14.0', '<') %}
            - Ventura restart after update: {{ ventura_update.stdout if ventura_update is defined and ventura_update.rc == 0 else "❌ Not configured" }}
            {% elif ansible_distribution_version is version('14.0', '>=') %}
            - Sonoma restart after update: {{ sonoma_update.stdout if sonoma_update is defined and sonoma_update.rc == 0 else "❌ Not configured" }}
            {% else %}
            - Unsupported macOS version
            {% endif %}
