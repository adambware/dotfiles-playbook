---
# Tests for the ruby role

- name: "Test ruby role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.ruby role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Verify rbenv installation
    - name: Verify rbenv is installed
      ansible.builtin.stat:
        path: "{{ rbenv_root }}/bin/rbenv"
      register: rbenv_check
      failed_when: not rbenv_check.stat.exists
      
    - name: Verify rbenv executable permissions
      ansible.builtin.stat:
        path: "{{ rbenv_root }}/bin/rbenv"
      register: rbenv_exec_check
      failed_when: not rbenv_exec_check.stat.executable
      when: rbenv_check.stat.exists
      
    - name: Verify rbenv version
      ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && rbenv --version
      args:
        executable: /bin/zsh
      register: rbenv_version
      changed_when: false
      failed_when: rbenv_version.rc != 0
      when: rbenv_check.stat.exists
      
    # Verify Ruby installations
    - name: Get installed Ruby versions
      ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && rbenv versions --bare
      args:
        executable: /bin/zsh
      register: ruby_versions
      changed_when: false
      failed_when: ruby_versions.rc != 0
      when: rbenv_check.stat.exists
      
    - name: Verify default Ruby version
      ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && rbenv global
      args:
        executable: /bin/zsh
      register: ruby_global
      changed_when: false
      failed_when: ruby_global.rc != 0
      when: rbenv_check.stat.exists
      
    # Verify Ruby gems
    - name: Verify gem is installed
      ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && gem --version
      args:
        executable: /bin/zsh
      register: gem_check
      changed_when: false
      failed_when: gem_check.rc != 0
      when: rbenv_check.stat.exists
      
    - name: Get list of installed gems
      ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && gem list
      args:
        executable: /bin/zsh
      register: gem_list
      changed_when: false
      failed_when: gem_list.rc != 0
      when: rbenv_check.stat.exists
      
    # Verify shell configuration
    - name: Verify rbenv in shell configuration
      ansible.builtin.shell: grep -q "rbenv init" {{ ansible_env.HOME }}/.zshrc
      register: rbenv_shell_check
      changed_when: false
      failed_when: rbenv_shell_check.rc != 0
      
    # Architecture-specific tests
    - name: Verify Apple Silicon specific configurations
      block:
        - name: Check Ruby architecture
          ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && ruby -e "puts RUBY_PLATFORM"
          args:
            executable: /bin/zsh
          register: ruby_arch_check
          changed_when: false
          failed_when: ruby_arch_check.rc != 0 or "arm64" not in ruby_arch_check.stdout
      when: ansible_architecture == "arm64" and rbenv_check.stat.exists
      
    - name: Verify Intel specific configurations
      block:
        - name: Check Ruby architecture
          ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && ruby -e "puts RUBY_PLATFORM"
          args:
            executable: /bin/zsh
          register: ruby_arch_check
          changed_when: false
          failed_when: ruby_arch_check.rc != 0 or "x86_64" not in ruby_arch_check.stdout
      when: ansible_architecture == "x86_64" and rbenv_check.stat.exists
      
    # Verify bundler
    - name: Verify bundler is installed
      ansible.builtin.shell: export RBENV_ROOT="{{ rbenv_root }}" && export PATH="$RBENV_ROOT/bin:$PATH" && eval "$(rbenv init -)" && bundle --version
      args:
        executable: /bin/zsh
      register: bundler_check
      changed_when: false
      failed_when: bundler_check.rc != 0
      when: rbenv_check.stat.exists
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All ruby role tests passed!
          
          rbenv installation:
            - rbenv exists: {{ "✅ OK" if rbenv_check.stat.exists else "❌ Failed" }}
            - rbenv executable: {{ "✅ OK" if rbenv_exec_check.stat.executable | default(false) else "❌ Failed" }}
            - rbenv version: {{ rbenv_version.stdout if rbenv_version.rc == 0 else "❌ Failed" }}
            
          Ruby installations:
            - Installed versions: 
              {% for version in ruby_versions.stdout_lines | default([]) %}
              * {{ version }}
              {% endfor %}
            - Global version: {{ ruby_global.stdout if ruby_global.rc == 0 else "❌ Failed" }}
            
          Ruby configuration:
            - gem: {{ "✅ OK" if gem_check.rc == 0 else "❌ Failed" }}
            - bundler: {{ "✅ OK" if bundler_check.rc == 0 else "❌ Failed" }}
            - Shell integration: {{ "✅ OK" if rbenv_shell_check.rc == 0 else "❌ Failed" }}
            
          Architecture-specific tests:
            {% if ansible_architecture == "arm64" %}
            - Apple Silicon architecture: {{ "✅ OK" if ruby_arch_check.rc == 0 and "arm64" in ruby_arch_check.stdout else "❌ Failed" }}
            {% else %}
            - Intel architecture: {{ "✅ OK" if ruby_arch_check.rc == 0 and "x86_64" in ruby_arch_check.stdout else "❌ Failed" }}
            {% endif %}
