---
# Tests for the zsh role

- name: "Test zsh role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.zsh role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Verify ZSH installation
    - name: Verify ZSH is installed
      ansible.builtin.command: which zsh
      register: zsh_check
      changed_when: false
      failed_when: zsh_check.rc != 0
      
    - name: Verify ZSH version
      ansible.builtin.command: zsh --version
      register: zsh_version
      changed_when: false
      failed_when: zsh_version.rc != 0
      
    - name: Verify ZSH is the default shell
      ansible.builtin.shell: echo $SHELL
      register: shell_check
      changed_when: false
      failed_when: zsh_path not in shell_check.stdout
      
    # Verify Oh My Zsh installation
    - name: Verify Oh My Zsh is installed
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.oh-my-zsh"
      register: ohmyzsh_check
      failed_when: not ohmyzsh_check.stat.exists
      
    - name: Verify custom theme installation
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/themes/adambware.zsh-theme"
      register: theme_check
      failed_when: not theme_check.stat.exists
      
    # Verify ZSH configuration files
    - name: Verify ZSH configuration files
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/{{ item }}"
      register: config_files
      with_items:
        - ".zshrc"
        - ".oh-my-zsh/custom/aliases.zsh"
        - ".oh-my-zsh/custom/completion.zsh"
        - ".oh-my-zsh/custom/config.zsh"
        - ".oh-my-zsh/custom/env.zsh"
      failed_when: not item.stat.exists
      
    - name: Verify ZSH theme configuration
      ansible.builtin.shell: grep "ZSH_THEME=" {{ ansible_env.HOME }}/.zshrc
      register: zsh_theme_check
      changed_when: false
      failed_when: zsh_theme_check.rc != 0 or "adambware" not in zsh_theme_check.stdout
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All zsh role tests passed!
          
          ZSH installation:
            - ZSH command: {{ "✅ OK" if zsh_check.rc == 0 else "❌ Failed" }}
            - ZSH version: {{ zsh_version.stdout if zsh_version.rc == 0 else "❌ Failed" }}
            - Default shell: {{ "✅ OK" if zsh_path in shell_check.stdout else "❌ Failed" }}
            
          Oh My Zsh:
            - Installation: {{ "✅ OK" if ohmyzsh_check.stat.exists else "❌ Failed" }}
            - Custom theme: {{ "✅ OK" if theme_check.stat.exists else "❌ Failed" }}
            - Theme setting: {{ "✅ OK" if zsh_theme_check.rc == 0 and "adambware" in zsh_theme_check.stdout else "❌ Failed" }}
            
          Configuration files:
            - .zshrc: {{ "✅ OK" if config_files.results[0].stat.exists else "❌ Failed" }}
            - aliases.zsh: {{ "✅ OK" if config_files.results[1].stat.exists else "❌ Failed" }}
            - completion.zsh: {{ "✅ OK" if config_files.results[2].stat.exists else "❌ Failed" }}
            - config.zsh: {{ "✅ OK" if config_files.results[3].stat.exists else "❌ Failed" }}
            - env.zsh: {{ "✅ OK" if config_files.results[4].stat.exists else "❌ Failed" }}
