---
# Tests for the homebrew-casks role

- name: "Test homebrew-casks role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.homebrew-casks role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Set facts for homebrew installed status
    - name: Set fact for homebrew installed status
      ansible.builtin.set_fact:
        homebrew_install_result: true
    
    # Verify Casks
    - name: Get list of installed casks
      ansible.builtin.command: brew list --cask
      register: installed_casks
      changed_when: false
      
    - name: Verify essential casks are installed
      ansible.builtin.assert:
        that: item in installed_casks.stdout_lines
        fail_msg: "Cask {{ item }} is not installed"
        success_msg: "Cask {{ item }} is installed"
      with_items:
        - iterm2
        - visual-studio-code
      register: essential_casks_check
      ignore_errors: true
      
    # Verify Applications
    - name: Verify Applications are installed
      ansible.builtin.stat:
        path: "/Applications/{{ item }}.app"
      register: app_check
      with_items:
        - "Visual Studio Code"
        - "iTerm"
      
    # Verify Cask Tap
    - name: Verify homebrew/cask tap is installed
      ansible.builtin.command: brew tap | grep homebrew/cask
      register: cask_tap_check
      changed_when: false
      failed_when: cask_tap_check.rc != 0
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ Homebrew casks tests completed!
          
          Installed casks (showing first 10):
          {% for cask in installed_casks.stdout_lines[:10] %}
          - {{ cask }}
          {% endfor %}
          {% if installed_casks.stdout_lines | length > 10 %}
          ... and {{ installed_casks.stdout_lines | length - 10 }} more
          {% endif %}
          
          Essential applications:
          - Visual Studio Code: {{ "✅ OK" if app_check.results[0].stat.exists else "❌ Failed" }}
          - iTerm: {{ "✅ OK" if app_check.results[1].stat.exists else "❌ Failed" }}
          
          Homebrew/cask tap: {{ "✅ OK" if cask_tap_check.rc == 0 else "❌ Failed" }}
