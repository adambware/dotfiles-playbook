---
# Tests for the homebrew-install role

- name: "Test homebrew-install role functionality"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../vars/main.yml
  
  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: 
          - "Running tests for adambware.homebrew-install role"
          - "Architecture: {{ ansible_architecture }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    # Verify Homebrew installation
    - name: Verify Homebrew is installed
      ansible.builtin.command: which brew
      register: brew_check
      changed_when: false
      failed_when: brew_check.rc != 0
      
    - name: Verify correct Homebrew prefix
      ansible.builtin.command: brew --prefix
      register: brew_prefix
      changed_when: false
      failed_when: not (brew_prefix.stdout == homebrew_prefix)
      
    - name: Verify Homebrew version
      ansible.builtin.command: brew --version
      register: brew_version
      changed_when: false
      failed_when: brew_version.rc != 0
      
    - name: Verify Homebrew doctor
      ansible.builtin.command: brew doctor
      register: brew_doctor
      changed_when: false
      failed_when: brew_doctor.rc != 0
      
    - name: Verify Homebrew permissions
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}"
      register: brew_stat
      failed_when: brew_stat.stat.mode != "0755"
      
    # Architecture-specific tests
    - name: Verify Apple Silicon specific configurations
      block:
        - name: Check Homebrew path is /opt/homebrew
          ansible.builtin.stat:
            path: "/opt/homebrew"
          register: opt_homebrew
          failed_when: not opt_homebrew.stat.exists
          
        - name: Verify PATH contains /opt/homebrew/bin
          ansible.builtin.shell: echo $PATH | grep -q "/opt/homebrew/bin"
          register: path_check
          changed_when: false
          failed_when: path_check.rc != 0
      when: ansible_architecture == "arm64"
      
    - name: Verify Intel specific configurations
      block:
        - name: Check Homebrew path is /usr/local
          ansible.builtin.stat:
            path: "/usr/local/Homebrew"
          register: usr_local_homebrew
          failed_when: not usr_local_homebrew.stat.exists
          
        - name: Verify PATH contains /usr/local/bin
          ansible.builtin.shell: echo $PATH | grep -q "/usr/local/bin"
          register: path_check
          changed_when: false
          failed_when: path_check.rc != 0
      when: ansible_architecture == "x86_64"
      
    # Print test results
    - name: Display test results
      ansible.builtin.debug:
        msg: |
          ✅ All homebrew-install role tests passed!
          
          Homebrew installation:
            - Homebrew command: {{ "✅ OK" if brew_check.rc == 0 else "❌ Failed" }}
            - Homebrew prefix: {{ "✅ OK" if brew_prefix.stdout == homebrew_prefix else "❌ Failed" }}
            - Homebrew version: {{ brew_version.stdout_lines[0] if brew_version.rc == 0 else "❌ Failed" }}
            - Homebrew doctor: {{ "✅ OK" if brew_doctor.rc == 0 else "❌ Failed" }}
            
          Architecture-specific tests:
            {% if ansible_architecture == "arm64" %}
            - Apple Silicon path: {{ "✅ OK" if opt_homebrew.stat.exists else "❌ Failed" }}
            - PATH contains /opt/homebrew/bin: {{ "✅ OK" if path_check.rc == 0 else "❌ Failed" }}
            {% else %}
            - Intel path: {{ "✅ OK" if usr_local_homebrew.stat.exists else "❌ Failed" }}
            - PATH contains /usr/local/bin: {{ "✅ OK" if path_check.rc == 0 else "❌ Failed" }}
            {% endif %}
