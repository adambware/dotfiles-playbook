---
# tasks file for adambware.homebrew-install

- name: Check if Homebrew is installed
  ansible.builtin.stat: 
    path: "{{ homebrew_brew_bin }}"
  register: homebrew_check

- name: Install Homebrew
  ansible.builtin.shell: /bin/bash -c "$(curl -fsSL {{ homebrew_install_url }})"
  when: not homebrew_check.stat.exists

- name: Add Homebrew to PATH (Apple Silicon)
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
    create: yes
  when: is_apple_silicon

- name: Set Homebrew analytics
  ansible.builtin.shell: "{{ homebrew_brew_bin }} analytics {{ 'on' if homebrew_analytics_enabled else 'off' }}"
  changed_when: false
  when: homebrew_check.stat.exists

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  when: homebrew_check.stat.exists